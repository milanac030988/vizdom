name: Release

# Builds the two things a user installs and attaches them to a GitHub Release:
#   1. the Python wheel - the VizDOM engine plus the Robot Framework library
#      (`Library    VisualGuiLibrary`), with the gRPC stubs generated in;
#   2. VizDOM Studio's all-in-one Windows installer - Studio, its own Python with
#      that wheel, CPU torch, EasyOCR models and Tesseract, so nothing else needs
#      to be installed.
#
# Push a tag to publish (the tag sets the version of both):
#   git tag v0.2.0 && git push origin v0.2.0
# "Run workflow" on the Actions tab builds the same artifacts without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    name: Python wheel (engine + Robot Framework library)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_version: ${{ steps.version.outputs.npm_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          # PEP 440 for the wheel, semver for the installer
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"; nv="$v"
          else
            v="0.0.0.dev${GITHUB_RUN_NUMBER}"; nv="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "npm_version=$nv" >> "$GITHUB_OUTPUT"
          sed -i "s/^version = \".*\"/version = \"$v\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Generate gRPC stubs
        run: |
          python -m pip install --upgrade pip build "grpcio-tools>=1.60,<1.63" "protobuf<6"
          python scripts/gen_protos.py

      - name: Build
        run: python -m build --wheel --sdist

      - name: Check the wheel installs and imports
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python -c "import VisualGuiLibrary, visual_dom, visual_gui_library; from visual_dom.generated import detector_pb2; print('ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  studio-windows:
    name: VizDOM Studio installer (Windows, CPU)
    needs: wheel
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v5

      - name: Install Tesseract (shipped inside the installer)
        run: choco install tesseract --no-progress -y

      - name: Bundle Python, VizDOM, OCR models
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          ./tools/vizdom_studio/scripts/bundle_python.ps1 -Wheel $wheel

      - name: Build the installer
        working-directory: tools/vizdom_studio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned; see the README
        run: |
          npm install --no-audit --no-fund
          npm version "${{ needs.wheel.outputs.npm_version }}" --no-git-tag-version --allow-same-version
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows
          path: tools/vizdom_studio/release/*.exe
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, studio-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
