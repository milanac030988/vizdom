name: Release

# Builds the two things a user installs and attaches them to a GitHub Release:
#   1. the Python wheel - the VizDOM engine plus the Robot Framework library
#      (`Library    VisualGuiLibrary`), with the gRPC stubs generated in;
#   2. VizDOM Studio's all-in-one Windows installer - Studio, its own Python with
#      that wheel, CPU torch, EasyOCR models and Tesseract, so nothing else needs
#      to be installed;
#   3. the same for Linux (x86-64) as an AppImage and a .deb, without Tesseract
#      (the .deb recommends the distribution's tesseract-ocr package).
#
# To publish, bump the version (pyproject.toml, tools/vizdom_studio/package.json)
# and add release-notes/v<version>.md, then push to develop. When that notes file
# exists and the tag v<version> does not, this workflow builds everything, creates
# the tag and the GitHub Release (the notes as its text), and uploads the wheel and
# the source package to PyPI as `vizdom`. Pushing a tag by hand works as before:
#   git tag v0.2.0 && git push origin v0.2.0
# "Run workflow" on the Actions tab builds the same artifacts without a release.

on:
  push:
    branches: [develop]
    paths:
      - "release-notes/v*.md"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Release or build only
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      npm_version: ${{ steps.plan.outputs.npm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: plan
        shell: bash
        run: |
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # a tag pushed by hand
            tag="$GITHUB_REF_NAME"; release=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # develop: release when the notes for the current version exist and
            # the version has not been released yet
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
            nv=$(node -p "require('./tools/vizdom_studio/package.json').version")
            tag="v$v"
            if [[ ! -f "release-notes/$tag.md" ]]; then
              echo "::notice::No release-notes/$tag.md - build only."
            elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::notice::$tag is already released - build only."
            elif [[ "$v" != "$nv" ]]; then
              echo "::error::pyproject.toml says $v but tools/vizdom_studio/package.json says $nv."
              exit 1
            else
              release=true
            fi
          fi
          if [[ "$release" == true ]]; then
            v="${tag#v}"; nv="$v"
          else
            # PEP 440 for the wheel, semver for the installer
            tag=""; v="0.0.0.dev${GITHUB_RUN_NUMBER}"; nv="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "npm_version=$nv" >> "$GITHUB_OUTPUT"
          echo "release=$release tag=$tag version=$v"

  wheel:
    name: Python wheel (engine + Robot Framework library)
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set the version
        shell: bash
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.plan.outputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Generate gRPC stubs
        run: |
          python -m pip install --upgrade pip build "grpcio-tools>=1.60,<1.63" "protobuf<6"
          python scripts/gen_protos.py

      - name: Build
        run: python -m build --wheel --sdist

      - name: Check the wheel installs and imports
        run: |
          python -m venv /tmp/check
          wheel=$(ls dist/*.whl)
          # bare install: the engine and the Robot Framework library import without extras
          /tmp/check/bin/pip install --quiet "$wheel"
          /tmp/check/bin/python -c "import VisualGuiLibrary, visual_dom, visual_gui_library; print('core ok')"
          # the gRPC stubs need protobuf/grpcio, which come with the grpc extra
          /tmp/check/bin/pip install --quiet "vizdom[grpc] @ file://$PWD/$wheel"
          /tmp/check/bin/python -c "from visual_dom.generated import detector_pb2, detector_pb2_grpc; print('grpc ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  studio-windows:
    name: VizDOM Studio installer (Windows, CPU)
    needs: [plan, wheel]
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v5

      - name: Install Tesseract (shipped inside the installer)
        run: choco install tesseract --no-progress -y

      - name: Bundle Python, VizDOM, OCR models
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          ./tools/vizdom_studio/scripts/bundle_python.ps1 -Wheel $wheel

      - name: Build the installer
        working-directory: tools/vizdom_studio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned; see the README
        run: |
          npm install --no-audit --no-fund
          npm version "${{ needs.plan.outputs.npm_version }}" --no-git-tag-version --allow-same-version
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows
          path: tools/vizdom_studio/release/*.exe
          if-no-files-found: error

  studio-linux:
    name: VizDOM Studio AppImage and .deb (Linux x86-64, CPU)
    needs: [plan, wheel]
    # the oldest supported runner: the bundled binaries then run on glibc 2.35 and newer
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v5

      - name: Virtual display for the bundle's import check (pyautogui needs X)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Bundle Python, VizDOM, OCR models
        run: xvfb-run -a bash tools/vizdom_studio/scripts/bundle_python.sh "$(ls dist/*.whl | head -1)"

      - name: Build the AppImage and the .deb
        working-directory: tools/vizdom_studio
        run: |
          npm install --no-audit --no-fund
          npm version "${{ needs.plan.outputs.npm_version }}" --no-git-tag-version --allow-same-version
          npm run dist:linux

      - name: Check the packaged Python runs from the install tree
        working-directory: tools/vizdom_studio/release
        run: |
          py="linux-unpacked/resources/python/bin/python3"
          PYTHONPATH=linux-unpacked/resources/vizdom/tools "$py" -c "import VisualGuiLibrary, vizdom_bridge.server, easyocr, robot; print('packaged python ok')"
          ls -lh *.AppImage *.deb

      - uses: actions/upload-artifact@v4
        with:
          name: studio-linux
          path: |
            tools/vizdom_studio/release/*.AppImage
            tools/vizdom_studio/release/*.deb
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: needs.plan.outputs.release == 'true'
    needs: [plan, wheel, studio-windows, studio-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Hand-written notes for the tag (release-notes/<tag>.md), if there are any;
      # GitHub's generated change list follows them.
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: release-notes

      - name: Release notes
        id: notes
        shell: bash
        run: |
          f="src/release-notes/${{ needs.plan.outputs.tag }}.md"
          if [[ -f "$f" ]]; then echo "body_path=$f" >> "$GITHUB_OUTPUT"; fi

      # Creates the tag on this commit when it does not exist yet (a tag made with
      # the workflow's token does not start this workflow again).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VizDOM ${{ needs.plan.outputs.version }}
          files: artifacts/*
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true

  pypi:
    name: PyPI (pip install vizdom)
    # Runs only once the installer has built too: a version can be uploaded to
    # PyPI only once, so a failed release must not leave half of it published.
    if: needs.plan.outputs.release == 'true'
    needs: [plan, wheel, studio-windows, studio-linux]
    runs-on: ubuntu-24.04
    # Trusted publishing: PyPI accepts this repository's release.yml in the
    # "pypi" environment, no token or password stored (see the README).
    environment:
      name: pypi
      url: https://pypi.org/project/vizdom/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
