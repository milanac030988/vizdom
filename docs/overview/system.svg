<a href="../system-overview/#c-rf" target="_top" class="node"><title>Robot Framework library: Write GUI tests in Robot Framework against what VizDOM sees on the screen.</title><rect class="box" x="40" y="60" width="330" height="84" rx="9" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.6"/><text x="205.0" y="98.0" font-size="15" font-weight="700" fill="#16645b" text-anchor="middle">Robot Framework library</text><text x="205.0" y="117.0" font-size="11.5" fill="#5a6878" text-anchor="middle">Library    VisualGuiLibrary</text></a>
<a href="../system-overview/#c-studio" target="_top" class="node"><title>VizDOM Studio: Look at an application the way VizDOM does, and build locators by hand.</title><rect class="box" x="415" y="60" width="330" height="84" rx="9" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.6"/><text x="580.0" y="98.0" font-size="15" font-weight="700" fill="#16645b" text-anchor="middle">VizDOM Studio</text><text x="580.0" y="117.0" font-size="11.5" fill="#5a6878" text-anchor="middle">desktop app (Windows installer)</text></a>
<a href="../system-overview/#c-python" target="_top" class="node"><title>Python API &amp; CLI: Build a Visual DOM from your own code, a script or another test framework.</title><rect class="box" x="790" y="60" width="330" height="84" rx="9" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.6"/><text x="955.0" y="98.0" font-size="15" font-weight="700" fill="#16645b" text-anchor="middle">Python API &amp; CLI</text><text x="955.0" y="117.0" font-size="11.5" fill="#5a6878" text-anchor="middle">visual_dom.connect()</text></a>
<a href="../system-overview/#c-config" target="_top" class="node"><title>Session config: One JSON file chooses the detector, OCR, capture, input and grounding, for every entry point.</title><rect class="box" x="40" y="230" width="1080" height="50" rx="9" fill="#eaf2fc" stroke="#4a78c2" stroke-width="1.6"/><text x="58" y="260.0" font-size="15" font-weight="700" fill="#244a86">Session config<tspan dx="14" font-size="11.5" font-weight="400" fill="#5a6878">vizdom.config.json  ·  one file drives every stage</tspan></text></a>
<a href="../system-overview/#c-capture" target="_top" class="node"><title>Capture: Takes the screenshot: the whole screen, or only the window of the application under test.</title><rect class="box" x="40" y="310" width="225" height="90" rx="9" fill="#ffffff" stroke="#5b6f8a" stroke-width="1.6"/><text x="152.5" y="351.0" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">Capture</text><text x="152.5" y="370.0" font-size="11.5" fill="#5a6878" text-anchor="middle">windows · linux · android · camera</text></a>
<a href="../system-overview/#c-pipeline" target="_top" class="node"><title>Detection pipeline: Turns the screenshot into elements: boxes, text, types and a containment tree.</title><rect class="box" x="325" y="310" width="225" height="90" rx="9" fill="#ffffff" stroke="#5b6f8a" stroke-width="1.6"/><text x="437.5" y="351.0" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">Detection pipeline</text><text x="437.5" y="370.0" font-size="11.5" fill="#5a6878" text-anchor="middle">detect · OCR · merge · hierarchy</text></a>
<a href="../system-overview/#c-dom" target="_top" class="node"><title>Visual DOM: The result: every element with its role, text, label, flags and ready-made locators.</title><rect class="box" x="610" y="310" width="225" height="90" rx="9" fill="#ffffff" stroke="#5b6f8a" stroke-width="1.6"/><text x="722.5" y="351.0" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">Visual DOM</text><text x="722.5" y="370.0" font-size="11.5" fill="#5a6878" text-anchor="middle">elements · locators · session folder</text></a>
<a href="../system-overview/#c-locator" target="_top" class="node"><title>Locator resolver: Finds the one element a locator means, or fails the step.</title><rect class="box" x="895" y="310" width="225" height="90" rx="9" fill="#ffffff" stroke="#5b6f8a" stroke-width="1.6"/><text x="1007.5" y="351.0" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">Locator resolver</text><text x="1007.5" y="370.0" font-size="11.5" fill="#5a6878" text-anchor="middle">text= · role= · desc= · || chains</text></a>
<a href="../system-overview/#c-plugins" target="_top" class="node"><title>Plugins: Add a capture source or an input device without changing VizDOM.</title><rect class="box" x="610" y="440" width="225" height="80" rx="9" fill="#ffffff" stroke="#5b6f8a" stroke-width="1.6"/><text x="722.5" y="476.0" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">Plugins</text><text x="722.5" y="495.0" font-size="11.5" fill="#5a6878" text-anchor="middle">your own capture source or actuator</text></a>
<a href="../system-overview/#c-actuator" target="_top" class="node"><title>Actuator: Delivers the click, the keystrokes and the scroll to the application.</title><rect class="box" x="975" y="440" width="145" height="80" rx="9" fill="#ffffff" stroke="#5b6f8a" stroke-width="1.6"/><text x="1047.5" y="476.0" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">Actuator</text><text x="1047.5" y="495.0" font-size="11.5" fill="#5a6878" text-anchor="middle">desktop · android</text></a>
<a href="../system-overview/#c-capsvc" target="_top" class="node"><title>Capture service: Takes the screenshot on the machine that shows the application.</title><rect class="box" x="40" y="615" width="225" height="70" rx="9" fill="#fff4e3" stroke="#c98a2b" stroke-width="1.6"/><text x="152.5" y="646.0" font-size="15" font-weight="700" fill="#7a4d0c" text-anchor="middle">Capture service</text><text x="152.5" y="665.0" font-size="11.5" fill="#5a6878" text-anchor="middle">:50053  ·  vizdom-capture</text></a>
<a href="../system-overview/#c-detsvc" target="_top" class="node"><title>Detector service: Runs the detector on a GPU host, one warm model for every test runner.</title><rect class="box" x="325" y="615" width="225" height="70" rx="9" fill="#fff4e3" stroke="#c98a2b" stroke-width="1.6"/><text x="437.5" y="646.0" font-size="15" font-weight="700" fill="#7a4d0c" text-anchor="middle">Detector service</text><text x="437.5" y="665.0" font-size="11.5" fill="#5a6878" text-anchor="middle">:50051  ·  vizdom-detector</text></a>
<a href="../system-overview/#c-ollama" target="_top" class="node"><title>Language model: Resolves the descriptions the lexical tier cannot, e.g. a paraphrase.</title><rect class="box" x="610" y="615" width="225" height="70" rx="9" fill="#f5f0ff" stroke="#8a6bbf" stroke-width="1.6" stroke-dasharray="6 4"/><text x="722.5" y="646.0" font-size="15" font-weight="700" fill="#4b2f80" text-anchor="middle">Language model</text><text x="722.5" y="665.0" font-size="11.5" fill="#5a6878" text-anchor="middle">Ollama :11434  ·  optional</text></a>
<a href="../system-overview/#c-actsvc" target="_top" class="node"><title>Actuator service: Delivers clicks and keystrokes on the machine that runs the application.</title><rect class="box" x="895" y="615" width="225" height="70" rx="9" fill="#fff4e3" stroke="#c98a2b" stroke-width="1.6"/><text x="1007.5" y="646.0" font-size="15" font-weight="700" fill="#7a4d0c" text-anchor="middle">Actuator service</text><text x="1007.5" y="665.0" font-size="11.5" fill="#5a6878" text-anchor="middle">:50054  ·  vizdom-actuator</text></a>
<a href="../system-overview/#c-aut" target="_top" class="node"><title>Application under test: Any application with a screen: desktop, embedded HMI, Android, or a screen seen through a camera.</title><rect class="box" x="40" y="760" width="1080" height="56" rx="9" fill="#2d3748" stroke="#2d3748" stroke-width="1.6"/><text x="58" y="793.0" font-size="15" font-weight="700" fill="#ffffff">Application under test<tspan dx="14" font-size="11.5" font-weight="400" fill="#d1d5db">untouched: no agent, no hooks, no accessibility tree needed</tspan></text></a>
<text x="1130" y="842" font-size="11" fill="#718096" text-anchor="end">Click a box for details  ·  solid: always  ·  dashed: optional, over the network</text>
