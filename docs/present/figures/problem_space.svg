000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="133" x="361.5" y="212.0488">(packed, few-pixel gaps)</text><line style="stroke:#888888;stroke-width:1.5;" x1="343.5" x2="353.5" y1="250.3906" y2="250.3906"/><rect fill="#FFFFFF" height="43.5977" rx="4" ry="4" style="stroke:#666666;stroke-width:1.5;" width="165" x="353.5" y="228.5918"/><text fill="#000000" filter="url(#b1f2bhatoupw3k3)" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="119" x="361.5" y="247.8477">High-precision region</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="149" x="361.5" y="261.6465">(a loose box is not enough)</text><line style="stroke:#888888;stroke-width:1.5;" x1="343.5" x2="343.5" y1="123.3965" y2="250.3906"/><line style="stroke:#888888;stroke-width:1.5;" x1="55" x2="343.5" y1="73.5977" y2="73.5977"/><rect fill="#FFFFFF" height="43.5977" rx="4" ry="4" style="stroke:#666666;stroke-width:1.5;" width="138" x="130.25" y="10"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="122" x="138.25" y="29.2559">GUI element detection</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="83" x="138.25" y="43.0547">problem space</text><line style="stroke:#888888;stroke-width:1.5;" x1="199.25" x2="199.25" y1="53.5977" y2="73.5977"/><!--SRC=[xLNRJkCm47tFLuoq3zi2wIMK2aLL1Rr1eTr5TClkmxvCco7rujYHxQGjY7_VILhOFl03As4fIZpsdF4vEfvSM8V6hHVM-mfNyp6Gf8IKyoDoj7H2AqYDNd3Gjoak2HnkjDB95YgFHYSm7my79_1B4903b3K86a6ZMcEmdxqPIDpgp86ma6Q6_1lC4IfAmvN1T9MBv_ei8OSAGH5555LhS4kKmkMiFnxxMibjpUjOjvNKzVY40u6nmGHUF80UBfzYepCLzRNK1hwCoi4h4w5e7skNWsDAHrIc0TnX50aLmtavcwA9XO9sEHbfvRvXGd1f1Chtq4my4pI3Sdw_gsWKcHBXbHyqHg_XvR3mUJbuzTNhrFS4lAD3VU5TtzzgBp2K0dj7Hz1PCBkme7GwR7I7-mn9ESbElLZhygw3RSD6B-XEc0g1KCwWlvHeBUJ8F7ObAbeHbD4JI51jmJ8fMxShJ8jNSK9R_G3qMiIh0fFC7jEAH4Z6TLi6NMJEiK5o3gT2iIOXs6pX99VATdXlSCFJKJ0QT0i1IXg7fNgzmN3Kwrwp84R7f4Xd5XAnuG9h4SNaB1o3I32cuiFHnbK_I1-GiW