site_name: VizDOM — Visual DOM Generator
site_description: Screenshot -> Visual DOM -> GUI Test Automation
# GitHub Pages landing URL (username.github.io/repo). Needed so links/assets
# resolve correctly on the deployed site (per deploy-properdocs skill).
site_url: https://milanac030988.github.io/vizdom/
docs_dir: docs

theme:
  name: readthedocs   # left sidebar navigation
  # Generated from the same code that draws the app icon:
  #     python tools/assets/make_app_icon.py
  favicon: img/favicon.png

extra_css:
  - css/extra.css

# Click a diagram -> fullscreen lightbox with zoom (wheel) + pan. Assets are
# bundled locally by the plugin (no CDN), so it works offline / behind the proxy.
plugins:
  - search
  - glightbox:
      zoomable: true
      draggable: true

# PlantUML rendered locally via the vendored jar (tools/plantuml.jar). No server
# (corporate proxy blocks plantuml.com) and no Graphviz (diagrams use the built-in
# Smetana layout via `!pragma layout smetana`). Only Java is required.
# base_dir lets `!include diagrams/*.puml` resolve from the docs/ folder.
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      # -Dplantuml.include.path lets `!include diagrams/*.puml` resolve (PlantUML
      # resolves includes relative to the process CWD = repo root under -pipe, so
      # the search path must point at docs/). Paths are relative to the repo root
      # (the build CWD).
      plantuml_cmd: java -Dplantuml.include.path=docs -jar tools/plantuml.jar -charset UTF-8
      base_dir: docs
      format: svg

