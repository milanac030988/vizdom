[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-gui-automation"
version = "0.1.0"
description = "Visual DOM Generator and Robot Framework GUI Automation Library"
readme = "readme.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["gui", "automation", "testing", "robot-framework", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "robotframework>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
]
ocr-paddle = [
    "paddlepaddle>=2.5.0",
    "paddleocr>=2.7.0",
]
llm = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
]
training = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "peft>=0.7.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "scipy>=1.10.0",
]
cv-training = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "albumentations>=1.3.0",
]
annotation = [
    "flask>=2.0.0",
    "label-studio>=1.10.0",
]
desktop = [
    "pyautogui>=0.9.54",
]
viewer = [
    "PyQt5>=5.15.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "visual-gui-automation[ocr,llm,desktop,viewer,dev]",
]

[project.urls]
Homepage = "https://github.com/yourusername/visual-gui-automation"
Documentation = "https://github.com/yourusername/visual-gui-automation#readme"
Repository = "https://github.com/yourusername/visual-gui-automation.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
